<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hanapin Nimo - Login Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes floatBubble {
            0% { transform: translateY(0px) scale(1); opacity: 0.6; }
            50% { transform: translateY(-10px) scale(1.05); opacity: 1; }
            100% { transform: translateY(0px) scale(1); opacity: 0.6; }
        }
        .bubble-anim { animation: floatBubble 3s ease-in-out infinite; }
    </style>
</head>
<body class="bg-gradient-to-br from-sky-400 via-blue-500 to-indigo-700 flex items-center justify-center min-h-screen relative overflow-hidden">
    <div class="absolute top-10 left-10 w-16 h-16 bg-white/20 rounded-full blur-sm bubble-anim pointer-events-none"></div>
    <div class="absolute bottom-16 right-20 w-24 h-24 bg-white/15 rounded-full blur-md bubble-anim pointer-events-none" style="animation-delay: 1s;"></div>
    <div class="bg-white/95 backdrop-blur-md p-8 rounded-3xl shadow-2xl w-full max-w-md border-4 border-orange-400 relative z-10">
        <div class="flex justify-end mb-4">
            <div class="inline-flex bg-amber-50 p-1 rounded-full border border-amber-200 shadow-inner">
                <button type="button" id="btn-student" onclick="switchRole('student')" class="px-3 py-1 text-xs font-bold rounded-full transition-all duration-200 bg-orange-500 text-white shadow-md">
                    Student
                </button>
                <button type="button" id="btn-personnel" onclick="switchRole('personnel')" class="px-3 py-1 text-xs font-bold rounded-full transition-all duration-200 text-slate-600 hover:text-orange-600">
                    Personnel
                </button>
            </div>
        </div>

        <!-- Header Area -->
        <div class="text-center mb-6">
            <div class="inline-block p-3 bg-orange-100 rounded-full text-orange-600 mb-2 shadow-inner border border-orange-200">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 animate-pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            <h1 id="portal-title" class="text-2xl font-black text-slate-800 tracking-wide">Student Portal</h1>
            <p id="portal-subtitle" class="text-xs font-medium text-slate-500 mt-1">Enter your 12-digit LRN to proceed</p>
            
            <div class="mt-3 inline-block bg-orange-500/10 text-orange-600 text-[11px] font-extrabold px-3 py-1 rounded-full border border-orange-200 tracking-wider uppercase">
                A Project by Hanapin Nimo
            </div>
        </div>
        <form id="authForm" onsubmit="handleAuthFlow(event)" class="space-y-4">
            <div id="step-id-container">
                <label id="input-label" for="idNumber" class="block text-xs font-extrabold uppercase tracking-wider text-orange-600 mb-2">
                    LRN (Learner Reference Number)
                </label>
                <input 
                    type="text" 
                    id="idNumber" 
                    required 
                    placeholder="Enter 12-digit LRN" 
                    class="w-full px-4 py-3 bg-sky-50/50 border-2 border-sky-100 rounded-2xl focus:outline-none focus:border-orange-400 focus:bg-white text-slate-800 font-medium transition"
                >
            </div>
            <div id="step-password-container" class="hidden">
                <label id="password-label" for="passwordInput" class="block text-xs font-extrabold uppercase tracking-wider text-orange-600 mb-2">
                    Password
                </label>
                <input 
                    type="password" 
                    id="passwordInput" 
                    placeholder="Enter password" 
                    class="w-full px-4 py-3 bg-sky-50/50 border-2 border-sky-100 rounded-2xl focus:outline-none focus:border-orange-400 focus:bg-white text-slate-800 font-medium transition"
                >
                <p id="password-hint" class="text-[10px] text-slate-400 mt-1">Setup or login password.</p>
            </div>
            <button 
                type="submit" 
                id="action-btn"
                class="w-full py-3.5 bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-bold rounded-2xl shadow-lg shadow-orange-500/30 transition-all duration-200"
            >
                Confirm & Check LRN
            </button>
            <button 
                type="button" 
                id="back-btn" 
                onclick="resetForm()" 
                class="w-full py-2 text-xs font-semibold text-slate-500 hover:text-slate-800 hidden"
            >
                ← Back to ID Entry
            </button>
        </form>
    </div>
    <script>
        let currentRole = 'student';
        let step = 1; 
        let verifiedId = '';
        let isRegistered = false;
        function switchRole(role) {
            currentRole = role;
            resetForm();
            const title = document.getElementById('portal-title');
            const subtitle = document.getElementById('portal-subtitle');
            const inputLabel = document.getElementById('input-label');
            const inputField = document.getElementById('idNumber');
            const btnStudent = document.getElementById('btn-student');
            const btnPersonnel = document.getElementById('btn-personnel');
            if (role === 'student') {
                btnStudent.className = "px-3 py-1 text-xs font-bold rounded-full transition-all duration-200 bg-orange-500 text-white shadow-md";
                btnPersonnel.className = "px-3 py-1 text-xs font-bold rounded-full transition-all duration-200 text-slate-600 hover:text-orange-600";
                title.innerText = "Student Portal";
                subtitle.innerText = "Enter your 12-digit LRN to proceed";
                inputLabel.innerText = "LRN (Learner Reference Number)";
                inputField.placeholder = "Enter 12-digit LRN";
            } else {
                btnPersonnel.className = "px-3 py-1 text-xs font-bold rounded-full transition-all duration-200 bg-orange-500 text-white shadow-md";
                btnStudent.className = "px-3 py-1 text-xs font-bold rounded-full transition-all duration-200 text-slate-600 hover:text-orange-600";
                title.innerText = "Personnel Portal";
                subtitle.innerText = "Enter your DepEd ID to proceed";
                inputLabel.innerText = "DepEd ID Number";
                inputField.placeholder = "Enter DepEd ID Number";
            }
        }
        function validateInputID(id) {
            if (currentRole === 'student') {
                return /^\d{12}$/.test(id);
            } else {
                return /^[a-zA-Z0-9]{4,}$/.test(id);
            }
        }
        function handleAuthFlow(event) {
            event.preventDefault();
            if (step === 1) {
                verifiedId = document.getElementById('idNumber').value.trim();
                if (!validateInputID(verifiedId)) {
                    if (currentRole === 'student') {
                        alert("❌ Invalid LRN! A Learner Reference Number (LRN) must be exactly 12 numeric digits.");
                    } else {
                        alert("❌ Invalid DepEd ID! Please enter a valid personnel ID (at least 4 alphanumeric characters).");
                    }
                    return;
                }
                const currentKey = `nimo_${currentRole}_${verifiedId}`;
                const savedData = localStorage.getItem(currentKey);
                step = 2;
                document.getElementById('step-id-container').classList.add('hidden');
                document.getElementById('step-password-container').classList.remove('hidden');
                document.getElementById('back-btn').classList.remove('hidden');
                document.getElementById('idNumber').removeAttribute('required');
                document.getElementById('passwordInput').setAttribute('required', 'true');
                const passLabel = document.getElementById('password-label');
                const passHint = document.getElementById('password-hint');
                const actionBtn = document.getElementById('action-btn');
                if (savedData) {
                    isRegistered = true;
                    alert("✅ Account is registered!");
                    passLabel.innerText = "Enter Your Password";
                    passHint.innerText = "Welcome back! Enter your permanent password to log in.";
                    actionBtn.innerText = "Log In";
                } else {
                    isRegistered = false;
                    alert("✨ First time login! Please set up your permanent password.");
                    passLabel.innerText = "Set Permanent Password";
                    passHint.innerText = "Create a permanent password to register this account.";
                    actionBtn.innerText = "Register Account";
                }

            } else {
                const password = document.getElementById('passwordInput').value;
                const currentKey = `nimo_${currentRole}_${verifiedId}`;

                if (!isRegistered) {
                    if (password.length < 4) {
                        alert("❌ Password is too short. Please use at least 4 characters.");
                        return;
                    }
                    localStorage.setItem(currentKey, JSON.stringify({ password: password }));
                    alert("🌊 Success! Account registered permanently.");
                    resetForm();
                } else {
                    const account = JSON.parse(localStorage.getItem(currentKey));
                    if (account.password === password) {
                        alert("🎉 Logged in successfully! Welcome to Hanapin Nimo.");
                    } else {
                        alert("❌ Incorrect password. Access denied.");
                    }
                }
            }
        }
        function resetForm() {
            step = 1;
            verifiedId = '';
            isRegistered = false;
            document.getElementById('step-id-container').classList.remove('hidden');
            document.getElementById('step-password-container').classList.add('hidden');
            document.getElementById('back-btn').classList.add('hidden');
            document.getElementById('idNumber').setAttribute('required', 'true');
            document.getElementById('passwordInput').removeAttribute('required');
            document.getElementById('action-btn').innerText = "Confirm & Check LRN";
            document.getElementById('idNumber').value = '';
            document.getElementById('passwordInput').value = '';
        }
    </script>
</body>
</html>
